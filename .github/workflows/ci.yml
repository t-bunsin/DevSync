# ---------------------------------------------------------------------------
# ZIN-WORKS — GitHub Actions CI/CD (ported from .gitlab-ci.yml)
#
# Jobs: lint (php + blade) -> test (unit, feature) -> build image
#
#   1. The Feature suite is allowed to fail on purpose. Six migrations issue
#      raw MySQL/PostgreSQL SQL (ALTER TABLE ... ADD CONSTRAINT, CREATE VIEW),
#      while phpunit.xml points the suite at sqlite :memory: — so migrate:fresh
#      cannot run and every database-backed test errors. See test-feature.
#
#   2. The pipeline stops at a published image on GHCR
#      (ghcr.io/<owner>/<repo>). There is no deploy job by design.
#
#   3. No asset build job: the compiled CSS/JS under public/ is committed and
#      the Dockerfile never runs npm.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - name: Validate composer.json
        run: composer validate --strict --no-check-all
      - name: PHP syntax check
        run: |
          find app bootstrap config database routes tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          echo "PHP syntax OK across app, bootstrap, config, database, routes, tests"
      - name: Compile Blade templates
        run: php artisan view:cache && echo "All Blade templates compiled"

  test-unit:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - name: Unit tests
        run: |
          mkdir -p reports
          vendor/bin/phpunit --testsuite Unit --no-coverage --colors=never --log-junit reports/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: reports/
          retention-days: 7

  # Runs so the breakage stays visible, but does not block the pipeline.
  test-feature:
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-php
      - name: Feature tests
        run: vendor/bin/phpunit --testsuite Feature --no-coverage --colors=never

  build-image:
    runs-on: ubuntu-latest
    needs: test-unit
    # Images from the default branch and tags only; PRs stop at tests.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
